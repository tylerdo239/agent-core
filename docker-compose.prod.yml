# docker-compose.prod.yml — Production override: không mount code, chạy image thuần túy
# Chạy prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Compose base vốn không bind-mount source; override này chỉ nói rõ production
# dùng Dockerfile chuẩn và named volume cho dữ liệu.

services:
  agent-core:
    build:
      dockerfile: Dockerfile
    volumes:
      - agent-core-data:/app/data
      # Không mount source/prompt — mọi runtime code đã COPY trong image.
    restart: unless-stopped
