# docker-compose.prod.yml — Production override: không mount code, chạy image thuần túy
# Chạy prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# (Ghi đè volumes của compose gốc để bỏ mount workspace)

services:
  agent-core:
    build:
      dockerfile: Dockerfile
    volumes:
      - agent-core-data:/app/data
      # KHÔNG mount ..:/workspace — code nằm trong image, không live
      # KHÔNG mount prompts — dùng bản đã COPY trong image
    restart: unless-stopped
