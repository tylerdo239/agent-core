# deploy/api-gateway.conf — Follow-up (2026-08): deploy VPS domain riêng.
#
# REST (agent-core:8787) và WS (agent-core:8788) là 2 SERVER RIÊNG trong
# agent-core (khác cổng), nhưng yêu cầu deploy chỉ có ĐÚNG 1 domain công khai
# cho "API" (vd. api-harness.onebot.meobeo.ai, 1 port duy nhất phía ngoài).
# Reverse proxy/TLS termination NẰM NGOÀI phạm vi compose này (đã xác nhận
# với user — nơi khác trỏ thẳng vào port này của VPS bằng HTTP thường) —
# service `api-gateway` ở đây CHỈ làm đúng 1 việc: gộp REST+WS lại thành 1
# port duy nhất bằng cách phân biệt request WS (header `Upgrade: websocket`)
# với request REST thường, KHÔNG tự làm TLS (nghe HTTP thường, port 80 nội
# bộ container — TLS do lớp ngoài phụ trách).
#
# Pattern `map` chọn upstream theo header Upgrade là cách chuẩn nginx khuyến
# nghị cho proxy WebSocket (an toàn hơn dùng `if` trong location, vốn có
# nhiều cạnh khó lường — xem "if is evil" trong tài liệu nginx).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_upgrade $agent_core_backend {
  default             rest_backend;
  "websocket"         ws_backend;
}

upstream rest_backend {
  server agent-core:8787;
}

upstream ws_backend {
  server agent-core:8788;
}

server {
  listen 80;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # REST turn dài (agent gọi tool/LLM nhiều bước) + WS giữ kết nối lâu —
    # timeout mặc định của nginx (60s) NGẮN hơn timeout thật của 1 turn, xem
    # OPENAI_TIMEOUT_MS/SESSION_TTL_MS trong .env.example.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://$agent_core_backend;
  }
}
