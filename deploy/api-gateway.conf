# deploy/api-gateway.conf — Follow-up (2026-08): deploy VPS domain riêng.
# Phase 6.3: REST và WS đã gộp thành 1 SERVER DUY NHẤT trong agent-core
# (bundles/adapters/api-rest, cùng port 8787 — bundle api-ws cũ đã xoá), nên
# file này KHÔNG còn cần chọn giữa 2 upstream theo header `Upgrade` nữa —
# chỉ còn phải forward header `Upgrade`/`Connection` đúng cách để WS handshake
# đi lọt qua nginx tới CHUNG 1 upstream (nginx vẫn cần biết đây là request
# nâng cấp WS để không buffer/đóng sớm, dù không còn phải chọn backend nào).
#
# Reverse proxy/TLS termination NẰM NGOÀI phạm vi compose này (đã xác nhận
# với user — nơi khác trỏ thẳng vào port này của VPS bằng HTTP thường) —
# service `api-gateway` ở đây CHỈ forward tới agent-core, KHÔNG tự làm TLS
# (nghe HTTP thường, port 80 nội bộ container — TLS do lớp ngoài phụ trách).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream agent_core_backend {
  server agent-core:8787;
}

server {
  listen 80;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # REST turn dài (agent gọi tool/LLM nhiều bước) + WS giữ kết nối lâu —
    # timeout mặc định của nginx (60s) NGẮN hơn timeout thật của 1 turn, xem
    # OPENAI_TIMEOUT_MS/SESSION_TTL_MS trong .env.example.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://agent_core_backend;
  }
}
