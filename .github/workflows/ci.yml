name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Uses the root vitest.config.ts, so legacy and newly added tests run
      # together. There is intentionally no alternate workspace that can hide
      # the old suite.
      - run: npm test
