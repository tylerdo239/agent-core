services:
  # Module auth (nhiều người dùng thật): Postgres riêng cho ctx.auth
  # (bundles/providers/auth-users) — KHÔNG đụng tới SQLite của ctx.storage
  # (event log hội thoại, vẫn nguyên trong volume agent-core-data). Named
  # volume riêng + healthcheck pg_isready — agent-core chờ đúng lúc Postgres
  # sẵn sàng (depends_on condition: service_healthy) trước khi tự thử kết
  # nối (auth-users cũng tự retry-with-backoff riêng, xem provider đó — 2
  # lớp phòng thủ, vì pg_isready healthy không đảm bảo 100% nhận connection
  # mới ngay lập tức).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bắt buộc, đặt trong .env}
      POSTGRES_DB: agent_core_users
    volumes:
      - agent-core-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Module memory (ctx.memory, TÙY CHỌN — xem docs/agent-core-memory-integration-plan.md):
  # TencentDB Agent Memory MemoryCore, image build sẵn công khai trên Docker
  # Hub, đa kiến trúc, không cần login. Data local (SQLite nội bộ image, chưa
  # cần Postgres/vector DB riêng) — named volume riêng. LLM riêng cho việc
  # trích xuất/tóm tắt: TÁI DÙNG THẲNG proxy Qwen3.5 agent-core đang dùng
  # (biến OPENAI_*) làm mặc định — chấp nhận rủi ro "thinking mode" đã ghi rõ
  # trong docs/agent-core-memory-integration-plan.md mục 5, KHÔNG áp dụng
  # patch source (tracked riêng ở memory-db/MemoryCore/docs/agent-core-llm-adapter.md,
  # ngoài phạm vi phase này). `agent-core` KHÔNG có `depends_on` container
  # này — memory-tencentdb provider tự resilient (lazy connect, remember/
  # recall best-effort, không throw) nên không cần chờ đồng bộ lúc boot như
  # Postgres (auth-users cần schema migration đồng bộ lúc init, memory thì
  # không).
  memory-core:
    image: agentmemory/memory-core:latest
    environment:
      TDAI_GATEWAY_PORT: "8420"
      TDAI_GATEWAY_HOST: "0.0.0.0"
      # Để trống có chủ đích: memory-core chỉ lắng nghe trong network nội bộ
      # docker-compose (không publish port ra host), không cần thêm 1 lớp
      # bearer admin nữa cho model triển khai "mạng nội bộ, tin cậy" đã chốt
      # xuyên suốt project (xem README "Production hardening"/"Giới hạn hiện tại").
      TDAI_GATEWAY_API_KEY: ""
      TDAI_DATA_DIR: /data/tdai-memory
      # LLM riêng cho trích xuất/tóm tắt nội bộ — mặc định TÁI DÙNG proxy Qwen
      # agent-core đang dùng (xem docs/agent-core-memory-integration-plan.md
      # mục 6 cho lý do/rủi ro). Đổi 3 biến này để switch provider khác,
      # KHÔNG cần sửa code (đã xác nhận qua đọc source, xem
      # memory-db/MemoryCore/docs/agent-core-llm-adapter.md mục 2).
      TDAI_LLM_BASE_URL: ${OPENAI_BASE_URL}
      TDAI_LLM_API_KEY: ${OPENAI_API_KEY}
      TDAI_LLM_MODEL: ${OPENAI_MODEL_ID}
    volumes:
      - agent-core-memory-core-data:/data/tdai-memory
    # Image có sẵn HEALTHCHECK riêng (curl GET /health cổng 8420, xác nhận
    # qua `docker inspect` thật, không đoán) — không cần định nghĩa lại.

  agent-core:
    image: "${AGENT_CORE_IMAGE:-agent-core:latest}"
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        AGENT_UID: "${AGENT_UID:-1019}"
        AGENT_GID: "${AGENT_GID:-1020}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://agent_core:${POSTGRES_PASSWORD}@postgres:5432/agent_core_users
      # Tuỳ chọn — bỏ trống/không set MEMORY_CORE_API_KEY thì ctx.memory
      # không mount, hệ thống chạy y hệt như không có module memory (xem
      # src/serve.ts). Bug thật đã gặp (2026-08): dòng MEMORY_CORE_URL ở đây
      # TỪNG có default cứng `http://memory-core:8420` — khiến biến này LUÔN
      # truthy trong container dù `.env` không set gì, làm FATAL check ở
      # serve.ts bắn sai cho MỌI deploy fresh không cấu hình memory. Bỏ hẳn
      # default ở đây — serve.ts giờ tự suy ra URL mặc định CHỈ KHI đã có
      # API key (đọc đúng thứ tự ưu tiên tại đó), compose chỉ cần pass-through
      # đúng những gì `.env` thật sự có.
      MEMORY_CORE_URL: ${MEMORY_CORE_URL:-}
      MEMORY_CORE_API_KEY: ${MEMORY_CORE_API_KEY:-}
      MEMORY_CORE_SERVICE_ID: ${MEMORY_CORE_SERVICE_ID:-default}
      # RLM harness (merge, xem docs/agent-core-rlm-harness-merge-plan.md) —
      # container phải dùng interpreter nằm trong image; không dùng đường
      # dẫn virtualenv bind-mount từ host.
      RLM_PYTHON_BIN: /usr/local/bin/python3
      # Phase 30: python/rlm_agent + vendor/rlm dời vào đúng bundle sở hữu
      # (bundles/loop-drivers/loop-rlm/python/), không còn ở root /app/python.
      RLM_RUNTIME_ROOT: /app/bundles/loop-drivers/loop-rlm/python
      # UI production-static nội bộ tránh cổng Vite. Người dùng truy cập
      # Vite/HMR ở host :8790; backend static vẫn tồn tại để test adapter.
      PORT_WEB_UI: "8791"
      CHOKIDAR_USEPOLLING: "1"
    ports:
      # Phase 6.3: WS đi chung port với REST (api-ws đã gộp vào api-rest) —
      # không còn PORT_WS/8788 riêng.
      - "${PORT_REST:-8787}:8787"
      - "${PORT_GRPC:-15052}:50051"
      - "${PORT_WEB_UI:-8790}:5173"
    volumes:
      - agent-core-data:/app/data
      # Một compose duy nhất cho giai đoạn phát triển: source trên host là
      # source thật trong container. Sửa TS/CSS không cần rebuild image.
      - ./seams:/app/seams
      - ./bundles:/app/bundles
      - ./src:/app/src
      - ./packages:/app/packages
      - ./apps:/app/apps
    restart: "no"
    command:
      - sh
      - -c
      - npm run dev:web -- --host 0.0.0.0 --port 5173 & exec npx tsx watch src/serve.ts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agent-core-data:
  agent-core-postgres-data:
  agent-core-memory-core-data:
